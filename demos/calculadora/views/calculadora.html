$def with(titulo, descripcion, resultado)
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
</head>
<body>
<h1>$titulo</h1>

<form method="POST">
<label>Número 1</label>
<input type="number" name="numero_1" id="numero_1"><br>

<label>Número 2</label>
<input type="number" name="numero_2" id="numero_2"><br>

<button name="suma">Sumar</button>
</form>

$if resultado != "":
    <p>Resultado: $resultado</p>

<p>$descripcion</p>
<a href="/">Index</a>
</body>
</html>
