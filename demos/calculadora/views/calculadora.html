$def with(numero_1, numero_2, resultado)

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora PRO</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        .resultado { color: green; font-size: 24px; font-weight: bold; }
        .botones button { width: 70px; }
    </style>
</head>
<body>
    <h1>Calculadora Web con web.py</h1>
    
    <form method="POST">
        <label>Número 1:</label><br>
        <input type="number" step="any" name="numero_1" value="$numero_1" required><br><br>
        
        <label>Número 2:</label><br>
        <input type="number" step="any" name="numero_2" value="$numero_2" required><br><br>
        
        <div class="botones">
            <button type="submit" name="operacion" value="sumar">+</button>
            <button type="submit" name="operacion" value="restar">-</button>
            <button type="submit" name="operacion" value="multiplicar">*</button>
            <button type="submit" name="operacion" value="dividir">/</button>
            <button type="submit" name="operacion" value="raiz">√</button>
            <button type="submit" name="operacion" value="potencia">^</button>
            <button type="submit" name="operacion" value="modulo">%</button>
            <button type="submit" name="operacion" value="limpiar">C</button>
        </div>
    </form>

    <label class="resultado">Resultado: $resultado</label>

    <br>
    <a href="/">Volver al Index</a>
</body>
</html>
